services:
  db:
    container_name: db
    image: "mongo:${MONGODB_VERSION}"
    command: "mongod --bind_ip 0.0.0.0 --port 27017"
    networks:
      open5gs:
        aliases:
          - db.open5gs.org
    volumes:
      - db_data:/data/db
      - db_config:/data/configdb
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    ports:
      - "0.0.0.0:27017:27017/tcp"

  webui:
    container_name: webui
    image: "ghcr.io/borjis131/webui:${OPEN5GS_VERSION}"
    networks:
      open5gs:
        aliases:
          - webui.open5gs.org
    ports:
      - "0.0.0.0:3000:9999/tcp"
    environment:
      - DB_URI=mongodb://db.open5gs.org:27017/open5gs
    depends_on:
      - db

  sctp-proxy:
    container_name: sctp-proxy
    build:
      context: ../../sctp_proxy
      dockerfile: Dockerfile
#    command: "tail -f /dev/null"
    command: "python3 /app/sctp_proxy_v5.py"  # ← Auto-start the proxy
    networks:
      open5gs:
        aliases:
          - proxy.open5gs.org
    ports:
      - "38412:38412/sctp"
      - "9999:9999/udp"
      - "9100:9100/tcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required for container control
    environment:
      - DISABLE_AUTO_RESTART=1
#    healthcheck:
#      # If re-enabled, probe the TCP metrics port — never the SCTP data plane
#      # (an SCTP probe creates a real association + backend AMF connection
#      # every interval, flooding proxy/AMF logs).
#      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9100), timeout=2); s.close()"]
#      interval: 10s
#      timeout: 3s
#      retries: 5
#      start_period: 5s
    depends_on:
      - amf1
      - amf2

  sctp-proxy2:
    container_name: sctp-proxy2
    build:
      context: ../../sctp_proxy
      dockerfile: Dockerfile
    command: "python3 /app/sctp_proxy_v5.py"
    networks:
      open5gs:
        aliases:
          - proxy2.open5gs.org
    ports:
      - "38413:38413/sctp"
      - "9998:9998/udp"
      - "9101:9100/tcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PROXY_LISTEN_PORT=38413
      - PROXY_CONTROL_PORT=9998
      - PROXY_METRICS_PORT=9100
      - DISABLE_AUTO_RESTART=1
    healthcheck:
      # Probe the TCP metrics port, NOT the SCTP data plane. The old SCTP probe
      # opened a full association every 2 s, and the proxy dutifully opened a
      # backend association to the current AMF for each one — flooding the
      # proxy and AMF logs with setup/teardown noise (~1000 cycles per run).
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9100), timeout=2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      - amf1
      - amf2

